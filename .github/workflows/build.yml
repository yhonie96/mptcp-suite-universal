name: Build OpenWrt APK
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-25.12.5
          PACKAGES: mptcp-suite-core mptcp-suite-routing mptcp-suite-traffic luci-app-mptcp-suite mptcp-suite-dual-xray
          V: s
          BUILD_LOG: 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mptcp-suite-apks-x86_64
          path: bin/packages/**/action/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mptcp-suite-core-x86_64
          path: |
            bin/packages/**/*.apk
            logs/**

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: bin/packages/**/action/*.apk
