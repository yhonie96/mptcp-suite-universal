name: Build OpenWrt APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-25.12.5
          PACKAGES: mptcp-suite-core mptcp-suite-routing mptcp-suite-traffic
          BUILD_LOG: 1

      - uses: actions/upload-artifact@v4
        with:
          name: mptcp-suite-core-x86_64
          path: |
            bin/packages/**/*.apk
            logs/**
