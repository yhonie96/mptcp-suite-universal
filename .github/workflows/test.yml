name: Test Core Package

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static validation
        shell: bash
        run: |
          set -e
          P=mptcp-suite-core
          test -f "$P/Makefile"
          test -f "$P/files/etc/config/mptcp_suite"

          for F in "$P"/files/usr/libexec/mptcp-suite/*; do
            sh -n "$F"
            test -x "$F"
          done

          test "$(awk 'index($0,"\t")==1{n++}END{print n+0}' "$P/Makefile")" -eq 6

      - name: Reject router-specific hardcodes
        shell: bash
        run: |
          set -e
          P=mptcp-suite-core
          if grep -RniE '192\.168\.(1|8)\.|eth1|phy0-sta0|WAN1|103\.147\.32\.114' "$P/files"; then
            echo "Router-specific hardcode found"
            exit 1
          fi

      - name: Validate package defaults
        shell: bash
        run: |
          set -e
          C=mptcp-suite-core/files/etc/config/mptcp_suite
          grep -q "option allocated '0'" "$C"
          ! grep -q "primary_wan" "$C"
          ! grep -q "secondary_wan" "$C"

      - name: Simulate install and uninstall
        shell: bash
        run: |
          set -euo pipefail
          P=mptcp-suite-core
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT

          install -d "$ROOT/etc/config" "$ROOT/etc/init.d" "$ROOT/usr/libexec/mptcp-suite"
          install -m 600 "$P/files/etc/config/mptcp_suite" "$ROOT/etc/config/"
          install -m 755 "$P/files/etc/init.d/mptcp-suite-core" "$ROOT/etc/init.d/"
          install -m 755 "$P"/files/usr/libexec/mptcp-suite/* "$ROOT/usr/libexec/mptcp-suite/"

          test "$(find "$ROOT" -type f | wc -l)" -eq 7
          test "$(stat -c %a "$ROOT/etc/config/mptcp_suite")" = 600
          test "$(stat -c %a "$ROOT/etc/init.d/mptcp-suite-core")" = 755
          sh -n "$ROOT/etc/init.d/mptcp-suite-core"

          for F in "$ROOT"/usr/libexec/mptcp-suite/*; do
            test "$(stat -c %a "$F")" = 755
            sh -n "$F"
          done

          rm -rf "$ROOT/usr/libexec/mptcp-suite"
          rm -rf "$ROOT/etc/init.d"
          test -f "$ROOT/etc/config/mptcp_suite"
          echo "INSTALL_UNINSTALL_SIMULATION_OK"

      - name: Test universal allocator
        shell: bash
        run: |
          set -e
          chmod +x tests/test-allocate.sh
          tests/test-allocate.sh

      - name: Test universal routing plan
        shell: bash
        run: |
          set -e
          chmod +x tests/test-routing-plan.sh
          tests/test-routing-plan.sh

      - name: Test traffic package
        shell: bash
        run: |
          set -e
          chmod +x tests/test-traffic-package.sh
          tests/test-traffic-package.sh

      - name: Test traffic policy plan
        shell: bash
        run: |
          set -e
          chmod +x tests/test-traffic-plan.sh
          sudo apt-get update
          sudo apt-get install -y nftables
          NFT_CHECK=1 sudo -E tests/test-traffic-plan.sh

      - name: Test LuCI MPTCP Suite package
        shell: bash
        run: |
          set -e
          chmod +x tests/test-luci-app-mptcp-suite.sh
          tests/test-luci-app-mptcp-suite.sh
